<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Improver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171C;
    --surface: #1B1F26;
    --surface-raised: #20242C;
    --border: #2A2F38;
    --text: #E6E8EB;
    --muted: #8B92A0;
    --muted-dim: #5C6270;
    --signal: #F2B705;
    --signal-dim: #7A6203;
    --danger: #E5484D;
    --radius: 6px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .titlebar .dots { display: flex; gap: 6px; }
  .titlebar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .titlebar .tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 4px 10px;
    background: var(--surface-raised);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .titlebar .tab .dim { color: var(--muted-dim); }

  main {
    flex: 1;
    display: flex;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 20px 12px;
    gap: 0;
    align-items: stretch;
  }

  .pane {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .pane-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .pane-header .badge {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted-dim);
    display: inline-block;
    margin-right: 6px;
  }
  .pane-header.output .badge.active { background: var(--signal); }

  textarea#inputText {
    flex: 1;
    min-height: 380px;
    background: transparent;
    color: var(--text);
    border: none;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  textarea#inputText::placeholder { color: var(--muted-dim); }

  #outputText {
    flex: 1;
    min-height: 380px;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-y: auto;
    color: var(--text);
  }
  #outputText:empty::before {
    content: 'Improved prompt will compile here.';
    color: var(--muted-dim);
  }

  .pane-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .rail {
    width: 88px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .rail::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 1px;
    background: var(--border);
  }
  #improveBtn {
    position: relative;
    z-index: 1;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid var(--signal-dim);
    background: var(--surface-raised);
    color: var(--signal);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  #improveBtn:hover:not(:disabled) {
    background: var(--signal);
    color: var(--bg);
    border-color: var(--signal);
    transform: scale(1.06);
  }
  #improveBtn:active:not(:disabled) { transform: scale(0.96); }
  #improveBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #improveBtn:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

  #improveBtn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  button#copyBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  button#copyBtn:hover { color: var(--text); border-color: var(--muted); }
  button#copyBtn:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .statusbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 7px 20px;
    background: var(--signal-dim);
    color: #F5DFA0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    flex-wrap: wrap;
  }
  .statusbar .sep { color: rgba(245, 223, 160, 0.4); }
  .statusbar strong { color: var(--signal); font-weight: 600; }

  @media (max-width: 760px) {
    main { flex-direction: column; padding: 16px; gap: 16px; }
    .rail { width: 100%; height: 60px; }
    .rail::before { top: 50%; left: 0; right: 0; width: auto; height: 1px; }
    textarea#inputText, #outputText { min-height: 220px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #improveBtn, #improveBtn.spinning svg { transition: none; animation: none; }
  }
</style>
</head>
<body>

  <div class="titlebar">
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="tab">prompt-improver<span class="dim">.compile</span></div>
  </div>

  <main>
    <div class="pane">
      <div class="pane-header">
        <span><span class="badge"></span>rough.txt</span>
      </div>
      <textarea id="inputText" placeholder="Paste your rough prompt here..."></textarea>
      <div class="pane-footer">
        <span class="meta" id="inputMeta">~0 tokens (estimate)</span>
      </div>
    </div>

    <div class="rail">
      <button id="improveBtn" aria-label="Improve prompt" title="Improve prompt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>

    <div class="pane">
      <div class="pane-header output">
        <span><span class="badge" id="outputBadge"></span>improved.txt</span>
        <button id="copyBtn">Copy</button>
      </div>
      <div id="outputText"></div>
      <div class="pane-footer">
        <span class="meta" id="outputMeta"></span>
      </div>
    </div>
  </main>

  <div class="statusbar" id="usageBar">Loading usage…</div>

  <script src="script.js"></script>
</body>
</html>
