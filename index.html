<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prompt Improver</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
  h1 { text-align:center; font-size:1.4rem; margin-bottom:8px; }
  .usage-bar { text-align:center; font-size:0.85rem; color:#999; margin-bottom:20px; }
  .container { display:flex; gap:16px; max-width:1200px; margin:0 auto; flex-wrap:wrap; }
  .panel { flex:1; min-width:300px; display:flex; flex-direction:column; }
  textarea, .output {
    flex:1; min-height:340px; background:#1c1c1c; color:#eee; border:1px solid #333;
    border-radius:8px; padding:12px; font-size:0.95rem; resize:vertical; white-space:pre-wrap;
  }
  button {
    margin-top:10px; padding:10px; border:none; border-radius:8px; background:#4f8cff;
    color:white; font-weight:600; cursor:pointer;
  }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  #copyBtn { background:#333; }
  .meta { margin-top:8px; font-size:0.85rem; color:#999; }
</style>
</head>
<body>
  <h1>Prompt Improver</h1>
  <div class="usage-bar" id="usageBar">Loading usage...</div>

  <div class="container">
    <div class="panel">
      <textarea id="inputText" placeholder="Paste your rough prompt here..."></textarea>
      <button id="improveBtn">Improve Prompt →</button>
      <div class="meta" id="inputMeta"></div>
    </div>
    <div class="panel">
      <div class="output" id="outputText"></div>
      <button id="copyBtn">Copy Output</button>
      <div class="meta" id="outputMeta"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
